[package]
name = "nanocodex"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors = ["Nanocodex Contributors", "Ben Clabby"]
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Interactive terminal coding agent built on the Nanocodex SDK"

[[bin]]
name = "nanocodex"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "nc"
path = "src/bin/nc.rs"
test = false
bench = false

[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
clap.workspace = true
futures-util.workspace = true
nanocode = { path = "../../crates/nanocode", version = "0.6.7" }
nanocode-home = { path = "../../crates/core/home", version = "0.6.7" }
nanocode-store-jsonl = { path = "../../crates/integrations/store-jsonl", version = "0.6.7" }
nanocode-tui = { path = "../../crates/tui", version = "0.6.7" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid.workspace = true

[lints]
workspace = true
