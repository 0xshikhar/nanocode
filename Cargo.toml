[workspace]
members = [
    "crates/nanocode",
    "crates/nanocode-tools",
    "crates/nanocode-codex-tools",
    "crates/nanocode-runtime",
    "crates/nanocode-claude",
    "crates/nanocode-claude-tools",
    "crates/nanocode-durability",
    "crates/nanocode-hand",
    "crates/nanocode-home",
    "crates/nanocode-codex",
    "crates/nanocode-code-mode",
    "crates/nanocode-observability",
    "crates/nanocode-subagents",
    "crates/nanocode-voice-protocol",
    "crates/nanocode-tools-macros",
    "crates/nanocode-cua",
    "js"
]
default-members = ["crates/nanocode"]
resolver = "2"

[workspace.package]
version = "0.6.7"
edition = "2024"
rust-version = "1.97"
authors = ["Nanocodex Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/gakonst/nanocodex"
repository = "https://github.com/gakonst/nanocodex"
readme = "README.md"
keywords = ["ai", "agents", "openai", "sdk", "websocket"]
categories = ["api-bindings", "asynchronous", "development-tools"]
publish = true

[workspace.dependencies]
nanocode-cua = { version = "0.6.7", path = "crates/nanocode-cua" }
nanocode-tools = { version = "0.6.7", path = "crates/nanocode-tools" }
nanocode-codex-tools = { version = "0.6.7", path = "crates/nanocode-codex-tools", default-features = false }
libc = "0.2"
base64 = "0.22.1"
async-trait = "=0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
bm25 = { version = "2.3.2", default-features = false }
chrono = { version = "0.4.43", default-features = false, features = ["clock", "std", "wasmbind"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
criterion = { version = "0.7.0", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
eyre = "0.6.12"
fs2 = "0.4"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "sink", "std"] }
roxmltree = "0.21.1"
getrandom = "0.4.3"
http = "1.3.1"
httpdate = "1.0.3"
ignore = "0.4.31"
jsonschema = { version = "0.48.5", default-features = false }
nanocode = { version = "0.6.7", path = "crates/nanocode" }
nanocode-runtime = { version = "0.6.7", path = "crates/nanocode-runtime" }
nanocode-claude = { version = "0.6.7", path = "crates/nanocode-claude" }
nanocode-claude-tools = { version = "0.6.7", path = "crates/nanocode-claude-tools", default-features = false }
nanocode-home = { version = "0.6.7", path = "crates/nanocode-home" }
nanocode-durability = { version = "0.6.7", path = "crates/nanocode-durability" }
nanocode-voice-protocol = { version = "0.6.7", path = "crates/nanocode-voice-protocol" }
nanocode-codex = { version = "0.6.7", path = "crates/nanocode-codex" }
nanocode-observability = { version = "0.6.7", path = "crates/nanocode-observability" }
nanocode-subagents = { version = "0.6.7", path = "crates/nanocode-subagents" }
nanocode-code-mode = { version = "0.6.7", path = "crates/nanocode-code-mode", default-features = false }
nanocode-tools-macros = { version = "0.6.7", path = "crates/nanocode-tools-macros" }
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "webp"] }
iana-time-zone = "0.1.64"
js-sys = "0.3.82"
nix = { version = "0.31.3", default-features = false, features = ["process", "resource", "signal", "socket", "user"] }
portable-pty = "0.9.0"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-client", "trace"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["experimental_trace_batch_span_processor_with_async_runtime", "rt-tokio", "trace"] }
opusic-c = "1.6.1"
proc-macro-crate = "3"
proc-macro2 = "1.0.106"
quote = "1.0.46"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustix = { version = "1.1.4", features = ["thread"] }
rustls-native-certs = "0.8.4"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio-postgres = "0.7"
rquickjs = "0.12.1"
rmcp = { version = "=3.0.0", default-features = false, features = ["auth", "client", "reqwest-tls-no-provider", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
oauth2 = { version = "5.0", default-features = false }
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
sha2 = { version = "0.11.0", default-features = false }
simd-json = "=0.15.1"
smallvec = { version = "1.15.1", features = ["serde"] }
sonic-rs = "0.5.8"
syn = { version = "2.0.119", features = ["full"] }
thiserror = "2.0.17"
tempfile = "3.27.0"
tokio = "1.48.0"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tower = { version = "0.5.2", features = ["limit", "load-shed", "retry", "timeout", "util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.4"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1", features = ["js", "serde", "v4", "v5", "v7"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-time = "1.1.0"
webrtc = "0.17.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"
large_enum_variant = "allow"
result_large_err = "allow"

# Match Reth and Solar's fast edit-build cycle: retain useful backtraces and
# source locations without emitting full local-variable debug information.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Third-party crates carry no debug info in dev builds. Workspace crates keep
# line tables, so panics and backtraces in Nanocodex code still report file and
# line, while debug executables and shared targets stay smaller and link faster.
[profile.dev.package."*"]
debug = false

# Hashing debug executables must not run each SHA intrinsic through unoptimized
# SIMD wrappers. Optimize the small hashing dependency; workspace code stays
# unoptimized with normal incremental compilation and useful backtraces.
[profile.dev.package."sha2:0.11.0"]
opt-level = 3

# Display math runs during interactive debug builds. Keep the small native
# parser/layout/raster stack optimized so a cold formula is ready in one frame.
[profile.dev.package.ratatex]
opt-level = 1

[profile.dev.package.ratex-font]
opt-level = 3

[profile.dev.package.ratex-font-loader]
opt-level = 3

[profile.dev.package.ratex-katex-fonts]
opt-level = 3

[profile.dev.package.ratex-layout]
opt-level = 3

[profile.dev.package.ratex-lexer]
opt-level = 3

[profile.dev.package.ratex-parser]
opt-level = 3

[profile.dev.package.ratex-render]
opt-level = 3

[profile.dev.package.ratex-types]
opt-level = 3

[profile.dev.package.ratex-unicode-font]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

# Nightlies favor fast feedback while retaining fully optimized portable code.
# Stable releases continue to use the thin-LTO release profile above.
[profile.nightly]
inherits = "release"
lto = false

# Opt-in builds can favor maximum runtime performance over build time, matching
# Reth's maxperf profile without raising the minimum CPU level of binaries.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Optimized enough for representative CPU profiles while retaining full symbols.
[profile.profiling]
inherits = "release"
debug = "full"
strip = false

# Keep benchmark symbols so Criterion regressions can be profiled directly.
[profile.bench]
inherits = "profiling"

[profile.wasm]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
