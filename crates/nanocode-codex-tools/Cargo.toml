[package]
name = "nanocode-codex-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Codex web search, image generation and image preparation"

[features]
default = ["native"]
native = ["nanocode-codex/client"]

[dependencies]
nanocode-codex = { version = "0.6.7", path = "../nanocode-codex", default-features = false }
nanocode-tools.workspace = true
base64.workspace = true
image.workspace = true
sha1.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait.workspace = true
reqwest.workspace = true
tracing.workspace = true

[dev-dependencies]
eyre.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt", "sync"] }
tempfile.workspace = true

[lints]
workspace = true
