[package]
autotests = false
autobenches = false
name = "nanocode-code-mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared tool registry, Code Mode and execution runtime for Codex and Claude"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["native"]
attachment = [
    "dep:async-trait",
    "dep:futures-util",
    "dep:http",
    "dep:httpdate",
    "dep:rustls",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:url",
    "dep:uuid",
]
workspace-runtime = [
    "dep:async-trait",
    "dep:base64",
    "dep:getrandom",
    "dep:portable-pty",
    "dep:regex",
    "dep:schemars",
    "dep:thiserror",
    "dep:tokio",
    "dep:nix",
    "dep:rustix",
]

native = ["code-mode", "mcp"]

image-processing = ["dep:base64", "dep:image", "dep:sha1", "dep:thiserror", "dep:tokio"]

code-mode = [
    "attachment",
    "image-processing",
    "workspace-runtime",
    "dep:futures-util",
    "dep:http",
    "dep:nanocode-tools-macros",
    "dep:reqwest",
    "dep:rquickjs",
]

mcp = ["code-mode", "dep:bm25", "dep:oauth2", "dep:rmcp", "dep:tokio-util"]

[dependencies]
nanocode-types.workspace = true
nanocode-media.workspace = true
nanocode-tools.workspace = true
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
nanocode-home.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait = { workspace = true, optional = true }
bm25 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
nanocode-tools-macros = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rquickjs = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }
rustix = { workspace = true, features = ["process"], optional = true }

[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.nanocode-tls]
workspace = true

[lib]
test = false
doctest = false
bench = false
