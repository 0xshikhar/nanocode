[package]
name = "nanocode-durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Portable durable execution state and stores for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = []
claude = ["dep:nanocode-claude"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres"]

[dependencies]
nanocode-claude = { workspace = true, optional = true }
nanocode-runtime.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
nanocode-subagents = { workspace = true, features = ["claude"] }
base64.workspace = true
image.workspace = true
nanocode-claude-tools.workspace = true
futures-util.workspace = true
nanocode-claude = { workspace = true, features = ["tools"] }
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
eyre.workspace = true
nanocode-codex.workspace = true
nanocode-code-mode = { workspace = true, features = ["code-mode"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tower.workspace = true

[lints]
workspace = true
