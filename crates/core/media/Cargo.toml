thiserror = { workspace = true  }
symphonia = { version = "0.6.0", default-features = false, features = ["isomp4", "mkv", "mp3", "ogg", "wav"]  }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt"]  }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
