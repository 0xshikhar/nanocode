["package"]
"name" = "nanocode-backend-codex"
"version" = { "workspace" = true }
"edition" = { "workspace" = true }
"rust-version" = { "workspace" = true }
"publish" = { "workspace" = true }
"authors" = { "workspace" = true }
"license" = { "workspace" = true }
"homepage" = { "workspace" = true }
"repository" = { "workspace" = true }
"keywords" = { "workspace" = true }
"categories" = { "workspace" = true }
"description" = "Codex backend: Responses client, agent driver, prompts and tools"
"metadata" = { "docs" = { "rs" = { "all-features" = true, "rustdoc-args" = ["-D", "warnings"] } } }

["features"]
"default" = ["openai", "client", "native", "rollout"]
"openai" = ["rollout", "dep:chrono", "dep:iana-time-zone", "nanocode-code-mode/code-mode", "dep:sha2", "dep:tower", "dep:web-time", "dep:uuid", "dep:wasm-bindgen-futures", "client"]
"rollout" = ["dep:chrono", "dep:uuid"]
"client" = ["dep:tokio-tungstenite", "events", "native-tls", "dep:getrandom", "dep:http", "dep:httpdate", "dep:rustls", "dep:sha2", "dep:tower", "dep:url", "dep:uuid"]
"native-tls" = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-platform-verifier"]
"events" = ["dep:web-time"]
"realtime" = ["client", "dep:opusic-c", "dep:webrtc"]
"native" = ["client"]

["dependencies"]
"nanocode-home" = { "workspace" = true }
"chrono" = { "workspace" = true, "optional" = true }
"futures-util" = { "workspace" = true }
"iana-time-zone" = { "workspace" = true, "optional" = true }
"nanocode-code-mode" = { "workspace" = true, "optional" = true }
"serde" = { "workspace" = true }
"serde_json" = { "workspace" = true }
"sha2" = { "workspace" = true, "optional" = true }
"thiserror" = { "workspace" = true }
"tokio" = { "workspace" = true, "features" = ["macros", "sync", "time"] }
"tower" = { "workspace" = true, "optional" = true }
"tracing" = { "workspace" = true, "optional" = true }
"web-time" = { "workspace" = true, "optional" = true }
"uuid" = { "workspace" = true, "optional" = true }
"nanocode-media" = { "workspace" = true }
"nanocode-types" = { "workspace" = true }
"sha1" = { "workspace" = true }
"image" = { "workspace" = true }
"async-trait" = { "workspace" = true }
"base64" = { "workspace" = true }
"http" = { "workspace" = true, "optional" = true }
"httpdate" = { "version" = "1.0.3", "optional" = true }
"smallvec" = { "workspace" = true }
"reqwest" = { "workspace" = true }
"nanocode-tools" = { "workspace" = true }
"schemars" = { "workspace" = true }
"nanocode-agent" = { "workspace" = true }

["target"]

["target"."cfg(not(target_family = \"wasm\"))"]

["target"."cfg(not(target_family = \"wasm\"))"."dependencies"]
"tokio" = { "workspace" = true, "features" = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "rt"] }
"getrandom" = { "workspace" = true, "optional" = true }
"reqwest" = { "workspace" = true, "optional" = true }
"rustls" = { "workspace" = true, "features" = ["std"], "optional" = true }
"rustls-native-certs" = { "workspace" = true, "optional" = true }
"tokio-tungstenite" = { "workspace" = true, "optional" = true }
"url" = { "workspace" = true, "optional" = true }
"opusic-c" = { "workspace" = true, "optional" = true }
"webrtc" = { "workspace" = true, "optional" = true }
"nanocode-tls" = { "workspace" = true }
"async-trait" = { "workspace" = true }
"tracing" = { "workspace" = true }

["target"."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))"]

["target"."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))"."dependencies"]
"wasm-bindgen-futures" = { "workspace" = true, "optional" = true }

["target"."cfg(target_os = \"macos\")"]

["target"."cfg(target_os = \"macos\")"."dependencies"]
"rustls-platform-verifier" = { "version" = "0.7.0", "optional" = true }

["lints"]
"workspace" = true


[lib]
test = false
doctest = false
bench = false
