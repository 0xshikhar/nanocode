[package]
name = "nanocode-cua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Thin MCP transport for the official external Sky computer provider"
include = ["src/**", "tests/**", "README.md", "Cargo.toml"]

[dependencies]
nanocode-tools.workspace = true
async-trait.workspace = true
base64.workspace = true
nanocode-codex = { version = "0.6.7", path = "../nanocode-codex", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
