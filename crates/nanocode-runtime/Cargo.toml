[package]
name = "nanocode-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Owned OpenAI agent lifecycle for Nanocodex"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["openai"]
openai = [
    "rollout",
    "dep:chrono",
    "dep:iana-time-zone",
    "dep:nanocode-code-mode",
    "nanocode-code-mode/code-mode",
    "dep:sha2",
    "dep:tower",
    "dep:tracing",
    "dep:web-time",
    "dep:uuid",
    "dep:wasm-bindgen-futures",
    "nanocode-codex/client",
]

# Codex-compatible JSONL rollout recording and loading, usable by every harness.
rollout = ["dep:chrono", "dep:tracing", "dep:uuid"]

[dependencies]
nanocode-home.workspace = true
chrono = { workspace = true, optional = true }
futures-util.workspace = true
iana-time-zone = { workspace = true, optional = true }
nanocode-codex = { version = "0.6.7", path = "../nanocode-codex", default-features = false, features = ["events"] }
nanocode-code-mode = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
criterion.workspace = true
eyre.workspace = true
futures-util.workspace = true
nanocode-code-mode = { workspace = true, features = ["mcp"] }
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true


[lints]
workspace = true
