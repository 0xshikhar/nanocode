[package]
autotests = false
autobenches = false
name = "nanocode-durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Portable durable execution state and stores for Nanocodex"

[package.metadata.docs.rs]
rustdoc-args = ["-D", "warnings"]

[dependencies]
nanocode-agent.workspace = true
nanocode-backend-codex.workspace = true
nanocode-backend-claude = { workspace = true  }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid.workspace = true
tower.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { workspace = true  }
tokio-postgres = { workspace = true  }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
