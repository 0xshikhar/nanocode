[package]
autotests = false
autobenches = false
name = "nanocode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Public composition and builders for the Nanocodex Rust agent crates"

[package.metadata.docs.rs]
rustdoc-args = ["-D", "warnings"]

[dependencies]
nanocode-platform.workspace = true
nanocode-agent.workspace = true
nanocode-backend-codex.workspace = true
nanocode-tools.workspace = true
nanocode-backend-claude = { workspace = true }
nanocode-durability = { workspace = true   }
nanocode-subagents.workspace = true
nanocode-code-mode = { path = "../runtime/code-mode", version = "0.6.7"   }
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-cua.workspace = true
async-trait.workspace = true
nanocode-store-jsonl.workspace = true
nanocode-home.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
