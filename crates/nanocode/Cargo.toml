[package]
autotests = false
autobenches = false
name = "nanocode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Alloy-style facade for the Nanocodex agents SDK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["durability", "mcp", "openai", "tools"]
claude-tools = []
durability = ["dep:nanocode-durability", "openai"]
sqlite = ["durability", "nanocode-durability/sqlite"]
postgres = ["durability", "nanocode-durability/postgres"]
mcp = ["tools", "nanocode-code-mode/mcp"]
observability = ["dep:nanocode-observability"]
openai = ["nanocode-backend-codex/openai", "nanocode-backend-codex/client"]
realtime = ["openai", "nanocode-backend-codex/realtime"]
tools = ["oai-tools"]
oai-tools = []
workspace-tools = [
    "tools",
    "nanocode-code-mode/workspace-runtime",
]

[dependencies]
nanocode-agent.workspace = true
nanocode-backend-codex.workspace = true
nanocode-tools.workspace = true
nanocode-backend-claude = { workspace = true }
nanocode-durability = { workspace = true, optional = true, features = ["claude"] }
nanocode-code-mode = { path = "../runtime/code-mode", version = "0.6.7", default-features = false, features = ["code-mode", "attachment"] }
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-cua.workspace = true

nanocode-backend-claude = { workspace = true, features = ["tools"] }
nanocode-observability = { workspace = true, optional = true }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
