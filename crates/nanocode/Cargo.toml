[package]
name = "nanocode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Alloy-style facade for the Nanocodex agents SDK"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = ["durability", "mcp", "openai", "tools"]
claude = [
    "dep:nanocode-claude",
    "dep:nanocode-claude-tools",
    "nanocode-durability?/claude",
    "nanocode-code-mode?/code-mode",
]
claude-tools = ["claude", "dep:nanocode-claude-tools", "nanocode-claude/tools"]
durability = ["dep:nanocode-durability", "openai"]
mcp = ["tools", "nanocode-code-mode/mcp"]
observability = ["dep:nanocode-observability"]
openai = ["nanocode-runtime/openai", "nanocode-codex/client"]
realtime = ["openai", "nanocode-codex/realtime"]
tools = ["oai-tools"]
oai-tools = [
    "dep:nanocode-codex-tools",
    "dep:nanocode-code-mode",
    "nanocode-code-mode/attachment",
]
workspace-tools = [
    "tools",
    "nanocode-code-mode/workspace-runtime",
]

[dependencies]
nanocode-tools.workspace = true
nanocode-codex-tools = { workspace = true, optional = true }
nanocode-runtime = { path = "../nanocode-runtime", version = "0.6.7", default-features = false }
nanocode-claude = { workspace = true, optional = true }
nanocode-durability = { workspace = true, optional = true }
nanocode-codex = { path = "../nanocode-codex", version = "0.6.7", default-features = false, features = ["events"] }
nanocode-code-mode = { path = "../nanocode-code-mode", version = "0.6.7", default-features = false, optional = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Native runtime Claude agents default to the canonical Claude file tools.
nanocode-claude = { workspace = true, optional = true, features = ["tools"] }
nanocode-claude-tools = { workspace = true, optional = true }
nanocode-observability = { workspace = true, optional = true }

[dev-dependencies]
nanocode-subagents.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
