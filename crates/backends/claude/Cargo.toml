[package]
autotests = false
autobenches = false
name = "nanocode-backend-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Anthropic Messages protocol and streaming transport"

[dependencies]
nanocode-agent.workspace = true
nanocode-durability.workspace = true
nanocode-types.workspace = true
nanocode-tools.workspace = true
nanocode-media.workspace = true
nanocode-home = { workspace = true  }
schemars = { workspace = true  }
base64.workspace = true
chrono.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
sha2.workspace = true
regex.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
url.workspace = true
futures-util.workspace = true
httpdate = "1.0.3"
image.workspace = true
nanocode-code-mode = { path = "../../runtime/code-mode", version = "0.6.7"   }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
web-time.workspace = true
uuid.workspace = true
reqwest = { workspace = true, features = ["stream", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["fs"]  }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["fs", "process", "rt-multi-thread"] }
nanocode-tls.workspace = true
tracing.workspace = true
ignore = { workspace = true  }
globset = { version = "0.4.19"  }
tempfile = { workspace = true  }
serde_yaml_ng = { workspace = true  }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures.workspace = true
wasmtimer = { version = "0.4.3", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
