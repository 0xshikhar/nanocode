[package]
name = "nanocode-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Embedded Node and browser WASM bindings for Nanocodex"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
nanocode-tools.workspace = true
async-trait.workspace = true
futures-util.workspace = true
js-sys.workspace = true
nanocode.workspace = true
nanocode-claude.workspace = true
nanocode-runtime.workspace = true
reqwest.workspace = true
nanocode-subagents = { workspace = true, features = ["claude"] }
nanocode-voice-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
